[package]
name = "gitbolt"
version = "0.1.0"
edition = "2021"
description = "Git GUI built with Dioxus Desktop"
license = "MIT OR Apache-2.0"
rust-version = "1.83"

[dependencies]
dioxus = { version = "0.7", features = ["desktop"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
