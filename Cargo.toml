[package]
name = "gitbolt"
version = "0.1.0"
edition = "2021"
description = "Git GUI built with Dioxus Desktop"
license = "MIT OR Apache-2.0"
rust-version = "1.83"

[dependencies]
dioxus = { version = "0.7", features = ["desktop"] }
dirs = "6.0.0"
gix = { version = "0.83.0", default-features = false, features = ["sha1", "status", "dirwalk", "max-performance-safe"] }
notify = "8.2.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["time"] }
arboard = "3.4"
open = "5"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# The design (docs/design/05-architecture.md) mandates names like `AppState`,
# `UiEvent`, `Command`, and `AppMessage` that repeat their module name.
module_name_repetitions = "allow"
